apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netvision-ingress
  labels:
    app: netvision
  annotations:
    # NGINX Ingress Controller annotations
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rpm: "1000"
    # SSL configuration (if using cert-manager)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Content-Type-Options nosniff;
      add_header X-Frame-Options DENY;
      add_header X-XSS-Protection "1; mode=block";
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin";
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";
spec:
  tls:
  - hosts:
    - netvision.example.com
    secretId: netvision-tls  # Managed by cert-manager or created manually
  rules:
  - host: netvision.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: netvision-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: netvision-backend
            port:
              number: 8000
      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: netvision-backend
            port:
              number: 8000