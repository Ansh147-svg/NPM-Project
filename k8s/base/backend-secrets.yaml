apiVersion: v1
kind: Secret
metadata:
  name: netvision-backend-secrets
  labels:
    app: netvision-backend
type: Opaque
data:
  # These values should be populated by external secrets manager
  # or created via kubectl create secret from literal values or files
  database-url: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  redis-url: {{ .Values.secrets.redisUrl | b64enc | quote }}
  influxdb-url: {{ .Values.secrets.influxdbUrl | b64enc | quote }}
  influxdb-token: {{ .Values.secrets.influxdbToken | b64enc | quote }}
  influxdb-org: {{ .Values.secrets.influxdbOrg | b64enc | quote }}
  influxdb-bucket: {{ .Values.secrets.influxdbBucket | b64enc | quote }}
  secret-key: {{ .Values.secrets.secretKey | b64enc | quote }}