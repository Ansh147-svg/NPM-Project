apiVersion: v1
kind: Secret
metadata:
  name: netvision-agent-secrets
  labels:
    app: netvision-agent
type: Opaque
data:
  # These values should be populated by external secrets manager
  agent-api-key: {{ .Values.secrets.agentApiKey | b64enc | quote }}
  agent-id: {{ .Values.secrets.agentId | b64enc | quote }}