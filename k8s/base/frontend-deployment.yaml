apiVersion: apps/v1
kind: Deployment
metadata:
  name: netvision-frontend
  labels:
    app: netvision-frontend
    version: v{{ .Values.image.tag }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: netvision-frontend
  template:
    metadata:
      labels:
        app: netvision-frontend
        version: v{{ .Values.image.tag }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: netvision-frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 2000
      containers:
      - name: frontend
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
        - name: http
          containerPort: 3000
        - name: metrics
          containerPort: 9091
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "{{ .Values.nextPublicApiUrl }}"
        - name: NEXT_PUBLIC_SITE_URL
          value: "{{ .Values.nextPublicSiteUrl }}"
        - name: NODE_ENV
          value: "{{ .Values.nodeEnv }}"
        resources:
          requests:
            cpu: "{{ .Values.resources.requests.cpu }}"
            memory: "{{ .Values.resources.requests.memory }}"
          limits:
            cpu: "{{ .Values.resources.limits.cpu }}"
            memory: "{{ .Values.resources.limits.memory }}"
        livenessProbe:
          httpGet:
            path: /_next/data/${NEXT_PUBLIC_BUILD_ID}/health.json
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /_next/data/${NEXT_PUBLIC_BUILD_ID}/health.json
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /_next/data/${NEXT_PUBLIC_BUILD_ID}/health.json
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 10
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: tmp-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: netvision-frontend
  labels:
    app: netvision-frontend
spec:
  selector:
    app: netvision-frontend
  ports:
  - name: http
    port: 80
    targetPort: http
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netvision-frontend
  labels:
    app: netvision-frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: netvision-frontend-pdb
  labels:
    app: netvision-frontend
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: netvision-frontend