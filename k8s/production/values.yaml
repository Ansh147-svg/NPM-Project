# Production environment values
replicaCount: 3

image:
  repository: ghcr.io/your-org/netvision
  pullPolicy: IfNotPresent
  tag: "v1.0.0"  # Should be updated for each release

# Backend specific
backend:
  replicaCount: 4
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  autoscaling:
    minReplicas: 4
    maxReplicas: 20
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 85

# Frontend specific
frontend:
  replicaCount: 3
  resources:
    requests:
      cpu: "300m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  autoscaling:
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
  nextPublicApiUrl: "https://netvision.example.com/api/v1"
  nextPublicSiteUrl: "https://netvision.example.com"
  nodeEnv: "production"

# Agent specific
agent:
  replicaCount: 8
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "800m"
      memory: "1Gi"
  autoscaling:
    minReplicas: 8
    maxReplicas: 50
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
  checkInterval: "15"
  backendUrl: "https://netvision.example.com/api/v1"

# Alert engine specific
alertEngine:
  replicaCount: 4
  resources:
    requests:
      cpu: "300m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  autoscaling:
    minReplicas: 4
    maxReplicas: 20
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 85
  kafkaBootstrapServers: "kafka-production:9092"

# Kafka specific
kafka:
  replicaCount: 5
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "3000m"
      memory: "6Gi"

# Global autoscaling defaults
autoscaling:
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 85

# Global resources defaults
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

# Secrets - these should be managed by external secrets manager in production
secrets:
  # Placeholder values - replace with actual secrets from vault/external manager
  databaseUrl: "postgresql://user:password@postgres-production:5432/monitoring"
  redisUrl: "redis://redis-production:6379/0"
  influxdbUrl: "http://influxdb-production:8086"
  influxdbToken: "production-token-very-long-and-secure"
  influxdbOrg: "monitoring"
  influxdbBucket: "metrics"
  secretKey: "production-secret-key-very-long-and-secure-change-this"
  agentApiKey: "production-agent-api-key-secure-value"
  agentId: "production-agent-uuid-secure-value"
  redisUrl: "redis://redis-production:6379/0"

logLevel: "warn"